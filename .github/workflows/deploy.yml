name: Deploy to Production Server

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH to Production Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -euo pipefail
            echo "🚀 Начинаем деплой обновления..."
            
            # Переходим в папку проекта на сервере
            mkdir -p /var/www/sulak
            cd /var/www/sulak

            # Безопасная проверка и включение 2GB Swap файла на сервере если RAM ограничена
            if [ ! -f /swapfile ]; then
              echo "⚙️ Создаём 2GB Swap файл на сервере для предотвращения OOM SIGABRT/SIGKILL..."
              fallocate -l 2G /swapfile 2>/dev/null || dd if=/dev/zero of=/swapfile bs=1M count=2048 2>/dev/null || true
              chmod 600 /swapfile 2>/dev/null || true
              mkswap /swapfile 2>/dev/null || true
              swapon /swapfile 2>/dev/null || true
            else
              swapon /swapfile 2>/dev/null || true
            fi

            # Загружаем свежие изменения из Git
            if [ ! -d ".git" ]; then
              git clone https://github.com/ser6eevich/sulak.git .
            else
              git fetch origin
              git reset --hard "origin/${{ github.ref_name }}"
            fi

            # Production-конфигурация хранится только на сервере и не попадает в Git.
            test -f .env
            chmod 600 .env
            for required_key in DATABASE_URL JWT_SECRET SETTINGS_ENCRYPTION_KEY; do
              grep -q "^${required_key}=" .env || {
                echo "❌ В .env отсутствует обязательный ключ ${required_key}"
                exit 1
              }
            done

            # Чистая установка строго по package-lock.json.
            npm ci --include=dev

            # npm run build выполняет prisma generate, который создаёт только клиент
            # приложения. Команды db push/migrate здесь намеренно запрещены: деплой
            # не должен менять структуру или данные production PostgreSQL.
            NEXT_DEPLOYMENT_ID="${{ github.sha }}" NEXT_TELEMETRY_DISABLED=1 NODE_OPTIONS="--max-old-space-size=2560" npm run build

            # Перезапуск процесса в PM2
            pm2 restart sulak --update-env || pm2 start npm --name "sulak" -- run start

            echo "✅ Деплой успешно завершён!"
