name: Deploy to Production Server

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH to Production Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Начинаем деплой обновления..."
            
            # Переходим в папку проекта на сервере (создаём если нет)
            mkdir -p /var/www/sulak
            cd /var/www/sulak

            # Загружаем свежие изменения из Git (или клонируем если папка не привязана)
            if [ ! -d ".git" ]; then
              git clone https://github.com/ser6eevich/sulak.git .
            else
              git fetch origin
              git reset --hard origin/master || git reset --hard origin/main
            fi

            # Устанавливаем зависимости
            npm install --production=false

            # Применяем миграции базы данных PostgreSQL
            npx prisma migrate deploy || npx prisma db push

            # Сборка Next.js проекта в 1 рабочий поток для экономии RAM сервера (предотвращает OOM SIGKILL)
            NEXT_TELEMETRY_DISABLED=1 EXPERIMENTAL_CPU_COUNT=1 NODE_OPTIONS="--max-old-space-size=1536" npm run build

            # Перезапуск процесса в PM2
            pm2 restart sulak || pm2 start npm --name "sulak" -- run start

            echo "✅ Деплой успешно завершён!"
